# The neutral "GDHCN" stand-in: our signed local test list and its signer, plus the
# pinned GDHCN DEV list and WHO's signer, served as did:web documents.
server {
  listen 80;
  default_type application/json;

  location = /local-test-list.json { alias /srv/testkit/local-test-list.json; }
  location = /signing/did.json { alias /srv/testkit/gdhcn-signer-did.json; }
  location = /dev/v2/trustlist/did.json { alias /srv/testkit/who/root-did.json; }
  location = /dev/signing/did.json { alias /srv/testkit/who/WHO-signing-did.json; }
  location / { return 404; }
}
