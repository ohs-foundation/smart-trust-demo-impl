name: smart-trust-demo

include:
  - path: onesa/compose.yaml
    env_file: .env
  - path: taifafeki/compose.yaml
    env_file: .env
  - path: gdhcn/compose.yaml
    env_file: .env

services:
  proxy:
    image: nginx:1.29.8-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDR}:${PROXY_PORT}:80"
    environment:
      STACK_HOST: ${STACK_HOST}
      PROXY_PORT: ${PROXY_PORT}
    volumes:
      - ./proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    mem_limit: 64m
