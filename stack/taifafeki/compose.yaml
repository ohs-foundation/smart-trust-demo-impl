services:
  medplum-postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: ${MEDPLUM_DB_PASSWORD}
    volumes:
      - medplum_postgres:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - statement_timeout=60000
      - -c
      - default_transaction_isolation=REPEATABLE READ
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum"]
      interval: 10s
      timeout: 5s
      retries: 5

  medplum-redis:
    image: valkey/valkey:8.1.11-alpine3.24
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${MEDPLUM_REDIS_PASSWORD}"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${MEDPLUM_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medplum:
    image: medplum/medplum-server:5.2.13
    restart: unless-stopped
    command: ["env"]
    environment:
      MEDPLUM_PORT: 8103
      MEDPLUM_BASE_URL: http://medplum.kesaro.${STACK_HOST}:${PROXY_PORT}/
      MEDPLUM_APP_BASE_URL: https://client.kesaro.${STACK_HOST}:${VHL_TLS_PORT}/
      MEDPLUM_STORAGE_BASE_URL: http://medplum.kesaro.${STACK_HOST}:${PROXY_PORT}/storage/
      MEDPLUM_DATABASE_HOST: medplum-postgres
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: medplum
      MEDPLUM_DATABASE_USERNAME: medplum
      MEDPLUM_DATABASE_PASSWORD: ${MEDPLUM_DB_PASSWORD}
      MEDPLUM_REDIS_HOST: medplum-redis
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_REDIS_PASSWORD: ${MEDPLUM_REDIS_PASSWORD}
      MEDPLUM_BINARY_STORAGE: file:./binary/
      MEDPLUM_SUPPORT_EMAIL: '"Trust demo" <support@kesaro.example>'
      MEDPLUM_MAX_JSON_SIZE: 1mb
      MEDPLUM_MAX_BATCH_SIZE: 50mb
      MEDPLUM_VM_CONTEXT_BOTS_ENABLED: "false"
      MEDPLUM_ALLOWED_ORIGINS: https://client.kesaro.${STACK_HOST}:${VHL_TLS_PORT}
      MEDPLUM_INTROSPECTION_ENABLED: "true"
      MEDPLUM_SHUTDOWN_TIMEOUT_MILLISECONDS: 30000
      # Applied when the database is first seeded, so Medplum never has its public default login.
      MEDPLUM_DEFAULT_SUPER_ADMIN_EMAIL: admin@kesaro.example
      MEDPLUM_DEFAULT_SUPER_ADMIN_PASSWORD: ${MEDPLUM_SUPER_ADMIN_PASSWORD}
      MEDPLUM_DEFAULT_SUPER_ADMIN_CLIENT_ID: ${MEDPLUM_SUPER_ADMIN_CLIENT_ID}
      MEDPLUM_DEFAULT_SUPER_ADMIN_CLIENT_SECRET: ${MEDPLUM_SUPER_ADMIN_CLIENT_SECRET}
    mem_limit: 1g
    depends_on:
      medplum-postgres:
        condition: service_healthy
      medplum-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8103/healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 600s

  issuer:
    build:
      context: ../..
      dockerfile: services/issuer/Dockerfile
    image: trust-demo-issuer:local
    restart: unless-stopped
    environment:
      MEDPLUM_FHIR_URL: http://medplum:8103/fhir/R4
      CARD_KEY_FILE: /run/keys/XXR_CARD.key.pem
      CARD_CERT_FILE: /run/keys/XXR_CARD.crt.pem
      JAVA_OPTS: -Xmx200m
    volumes:
      - ../../testkit/XXR_CARD.key.pem:/run/keys/XXR_CARD.key.pem:ro
      - ../../testkit/XXR_CARD.crt.pem:/run/keys/XXR_CARD.crt.pem:ro
    mem_limit: 320m
    depends_on:
      medplum:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  client:
    build:
      context: ../../apps/taifafeki-client
      additional_contexts:
        hcert: ../../build/hcert-js
    image: trust-demo-taifafeki-client:local
    restart: unless-stopped
    environment:
      PORT: 3000
      MEDPLUM_BASE_URL: https://medplum.kesaro.${STACK_HOST}:${VHL_TLS_PORT}
      MEDPLUM_INTERNAL_URL: http://medplum:8103
      CLIENT_ORIGIN: https://client.kesaro.${STACK_HOST}:${VHL_TLS_PORT}
      ISSUER_URL: http://issuer:8080
      MEDPLUM_CLIENT_ID_FILE: /run/secrets/medplum-client-id
      NODE_EXTRA_CA_CERTS: /run/secrets/tls/ca.crt
      ONESA_VHL_HOSTS: vhl.onesa.${STACK_HOST}:${VHL_TLS_PORT}
      CLINIC_KEY_FILE: /run/secrets/clinic-viewer.key
      CLINIC_CERT_FILE: /run/secrets/clinic-viewer.crt
      TRUST_LIST_URL: http://gdhcn/local-test-list.json
      DEV_TRUST_LIST_URL: http://gdhcn/dev/v2/trustlist/did.json
    volumes:
      - ./secrets/medplum-client-id:/run/secrets/medplum-client-id:ro
      - ./secrets/clinic-viewer.key:/run/secrets/clinic-viewer.key:ro
      - ./secrets/clinic-viewer.crt:/run/secrets/clinic-viewer.crt:ro
      - ../tls/ca.crt:/run/secrets/tls/ca.crt:ro
    mem_limit: 256m
    depends_on:
      issuer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  medplum_postgres:
