# Builds what testers install: the debug APK, and the server images in the registry.
# The base domain and the GCP settings are repository secrets, never variables: the logs of a public
# repository mask secrets and print variables in clear. Values derived at runtime are masked by hand.

name: Artifacts

on:
  push:
    branches: [seed-from-template, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: What to build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      apk: ${{ steps.check.outputs.apk }}
      gcp: ${{ steps.check.outputs.gcp }}
    steps:
      # Jobs cannot test secrets in their own `if`, so this job decides for them.
      - id: check
        env:
          BASE: ${{ secrets.LIVE_BASE_DOMAIN }}
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          apk=false
          gcp=false
          if [ -n "$BASE" ]; then apk=true; else
            echo "::notice title=APK skipped::Set the repository secret LIVE_BASE_DOMAIN to build the APK."
          fi
          if [ -n "$BASE" ] && [ -n "$PROVIDER" ] && [ -n "$ACCOUNT" ] && [ -n "$REGISTRY" ]; then gcp=true; else
            echo "::notice title=GCP skipped::Set the secrets LIVE_BASE_DOMAIN, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_CI_SERVICE_ACCOUNT and REGISTRY to push the images and publish the APK."
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "gcp=$gcp" >> "$GITHUB_OUTPUT"

  apk:
    name: Debug APK
    needs: gate
    if: ${{ needs.gate.outputs.apk == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    env:
      BASE: ${{ secrets.LIVE_BASE_DOMAIN }}
      REGISTRY: ${{ secrets.REGISTRY }}
      APK_BUCKET: ${{ secrets.APK_BUCKET }}
    steps:
      - name: Mask derived values
        run: |
          for host in keycloak gateway vhl; do echo "::add-mask::$host.onesa.$BASE"; done
          echo "::add-mask::trust.gdhcn.$BASE"
          if [ -n "$APK_BUCKET" ]; then echo "::add-mask::$APK_BUCKET"; echo "::add-mask::gs://$APK_BUCKET"; fi
          if [ -n "$REGISTRY" ]; then
            echo "::add-mask::${REGISTRY%%/*}"
            echo "::add-mask::${REGISTRY#*/}"
            path="${REGISTRY#*/}"
            echo "::add-mask::${path%%/*}"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # hcert-core's build predates Gradle 9, so it runs on a Gradle 8 installed beside the wrapper.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.14.3'

      - name: Publish hcert-core to mavenLocal
        run: gradle -p "$(./stack/smart-trust-tools.sh)/tools/hcert-kotlin" publishToMavenLocal --stacktrace

      - name: Assemble
        env:
          OAUTH_ISSUER: https://keycloak.onesa.${{ secrets.LIVE_BASE_DOMAIN }}/realms/onesa
          FHIR_BASE_URL: https://gateway.onesa.${{ secrets.LIVE_BASE_DOMAIN }}/fhir/
          VHL_BASE_URL: https://vhl.onesa.${{ secrets.LIVE_BASE_DOMAIN }}
          TRUST_LIST_URL: https://trust.gdhcn.${{ secrets.LIVE_BASE_DOMAIN }}/local-test-list.json
        run: ./gradlew :apps:onesa:android:assembleDebug -Pkotlin.daemon.jvmargs="-Xmx6g -XX:+UseG1GC" --stacktrace

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "tag=$GITHUB_REF_NAME"; else echo "tag=$(git rev-parse --short HEAD)"; fi >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: ${{ needs.gate.outputs.gcp == 'true' }}
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      # A public repository's artifacts are downloadable by any GitHub user, and the APK embeds the live URLs.
      # The custom time marks the per-build copy for the bucket's 30-day lifecycle rule; onesa-latest.apk has none.
      - name: Publish the APK privately
        if: ${{ needs.gate.outputs.gcp == 'true' && env.APK_BUCKET != '' }}
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          apk="$(ls apps/onesa/android/build/outputs/apk/debug/*.apk)"
          type=application/vnd.android.package-archive
          gcloud storage cp --content-type="$type" --custom-time="$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$apk" "gs://$APK_BUCKET/onesa-$VERSION.apk"
          gcloud storage cp --content-type="$type" "$apk" "gs://$APK_BUCKET/onesa-latest.apk"

      - if: ${{ needs.gate.outputs.gcp != 'true' || env.APK_BUCKET == '' }}
        run: echo "::notice title=APK not published::Set the GCP secrets and APK_BUCKET to publish the APK to the private bucket."

  images:
    name: Server images
    needs: gate
    if: ${{ needs.gate.outputs.gcp == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    env:
      BASE: ${{ secrets.LIVE_BASE_DOMAIN }}
      REGISTRY: ${{ secrets.REGISTRY }}
    steps:
      - name: Mask derived values
        run: |
          path="${REGISTRY#*/}"
          echo "::add-mask::${REGISTRY%%/*}"
          echo "::add-mask::$path"
          echo "::add-mask::${path%%/*}"
          for host in keycloak gateway web vhl; do echo "::add-mask::$host.onesa.$BASE"; done
          for host in medplum client; do echo "::add-mask::$host.kesaro.$BASE"; done
          echo "::add-mask::trust.gdhcn.$BASE"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.14.3'

      - name: Publish hcert-core to mavenLocal
        run: gradle -p "$(./stack/smart-trust-tools.sh)/tools/hcert-kotlin" publishToMavenLocal --stacktrace

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Log Docker in to the registry
        run: gcloud auth configure-docker --quiet "${REGISTRY%%/*}"

      # The web portal bakes its hostnames at build, so they come from the same base domain as the server's.
      - name: Build and push
        run: |
          cd infra
          ./dev.sh init
          sed -i -e "s|^BASE_DOMAIN=.*|BASE_DOMAIN=$BASE|" -e "s|^REGISTRY=.*|REGISTRY=$REGISTRY|" .env
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="$(git rev-parse --short HEAD)"; fi
          ./dev.sh push "$tag" vhl issuer taifafeki-client web-portal
