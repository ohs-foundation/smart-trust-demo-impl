# Builds what testers install: the debug APK, and the server images in the registry.
# The base domain is the repository secret LIVE_BASE_DOMAIN, so the logs mask it; the registry
# settings are repository variables (Settings > Secrets and variables > Actions).

name: Artifacts

on:
  push:
    branches: [seed-from-template, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: What to build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      apk: ${{ steps.check.outputs.apk }}
      images: ${{ steps.check.outputs.images }}
    steps:
      # Jobs cannot test secrets in their own `if`, so this job decides for them.
      - id: check
        env:
          BASE: ${{ secrets.LIVE_BASE_DOMAIN }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          apk=false
          images=false
          if [ -n "$BASE" ]; then apk=true; else
            echo "::notice title=APK skipped::Set the repository secret LIVE_BASE_DOMAIN to build the APK."
          fi
          if [ -n "$BASE" ] && [ -n "$PROVIDER" ] && [ -n "$ACCOUNT" ] && [ -n "$REGISTRY" ]; then images=true; else
            echo "::notice title=Images skipped::Set the secret LIVE_BASE_DOMAIN and the variables GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_CI_SERVICE_ACCOUNT and REGISTRY to push the images."
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  apk:
    name: Debug APK
    needs: gate
    if: ${{ needs.gate.outputs.apk == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # hcert-core's build predates Gradle 9, so it runs on a Gradle 8 installed beside the wrapper.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.14.3'

      - name: Publish hcert-core to mavenLocal
        run: gradle -p "$(./stack/smart-trust-tools.sh)/tools/hcert-kotlin" publishToMavenLocal --stacktrace

      - name: Assemble
        env:
          OAUTH_ISSUER: https://keycloak.onesa.${{ secrets.LIVE_BASE_DOMAIN }}/realms/onesa
          FHIR_BASE_URL: https://gateway.onesa.${{ secrets.LIVE_BASE_DOMAIN }}/fhir/
          VHL_BASE_URL: https://vhl.onesa.${{ secrets.LIVE_BASE_DOMAIN }}
          TRUST_LIST_URL: https://trust.gdhcn.${{ secrets.LIVE_BASE_DOMAIN }}/local-test-list.json
        run: ./gradlew :apps:onesa:android:assembleDebug -Pkotlin.daemon.jvmargs="-Xmx6g -XX:+UseG1GC" --stacktrace

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "tag=$GITHUB_REF_NAME"; else echo "tag=$(git rev-parse --short HEAD)"; fi >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onesa-${{ steps.version.outputs.tag }}
          path: apps/onesa/android/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  images:
    name: Server images
    needs: gate
    if: ${{ needs.gate.outputs.images == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    env:
      REGISTRY: ${{ vars.REGISTRY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.14.3'

      - name: Publish hcert-core to mavenLocal
        run: gradle -p "$(./stack/smart-trust-tools.sh)/tools/hcert-kotlin" publishToMavenLocal --stacktrace

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Log Docker in to the registry
        run: gcloud auth configure-docker --quiet "${REGISTRY%%/*}"

      # The web portal bakes its hostnames at build, so they come from the same base domain as the server's.
      - name: Build and push
        env:
          BASE: ${{ secrets.LIVE_BASE_DOMAIN }}
        run: |
          cd infra
          ./dev.sh init
          sed -i -e "s|^BASE_DOMAIN=.*|BASE_DOMAIN=$BASE|" -e "s|^REGISTRY=.*|REGISTRY=$REGISTRY|" .env
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="$(git rev-parse --short HEAD)"; fi
          ./dev.sh push "$tag" vhl taifafeki-client web-portal
