# Runs ./gradlew check on every pull request and on pushes to main.

name: Kotlin

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kotlin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  spotless:
    name: Spotless (formatting)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run spotlessCheck
        run: ./gradlew spotlessCheck --stacktrace

  check:
    name: Build + test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: jvm
            label: JVM/Desktop
            tasks: ':apps:onesa:shared:jvmTest :libs:trustkit:check :tools:control:check'
          - id: android
            label: Android
            tasks: ':apps:onesa:shared:assembleAndroidMain :apps:onesa:android:lintDebug'
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # hcert-core's build predates Gradle 9, so it runs on a Gradle 8 installed beside the wrapper.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Publish hcert-core to mavenLocal
        run: |
          git clone https://github.com/litlfred/smart-trust-tools.git "$RUNNER_TEMP/smart-trust-tools"
          git -C "$RUNNER_TEMP/smart-trust-tools" checkout d94e21d
          gradle -p "$RUNNER_TEMP/smart-trust-tools/tools/hcert-kotlin" publishToMavenLocal --stacktrace

      - name: Run ${{ matrix.label }}
        run: ./gradlew ${{ matrix.tasks }} -Pkotlin.daemon.jvmargs="-Xmx6g -XX:+UseG1GC" --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.id }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore
