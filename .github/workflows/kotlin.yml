# Runs ./gradlew check on every pull request and on pushes to main.

name: Kotlin

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kotlin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  client:
    name: Facility client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.14.3'

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: apps/taifafeki-client/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - run: make hcert-js

      - name: Install, typecheck, test
        working-directory: apps/taifafeki-client
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

  check:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # hcert-core's build predates Gradle 9, so it runs on a Gradle 8 installed beside the wrapper.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.14.3'

      - name: Publish hcert-core to mavenLocal
        run: gradle -p "$(./stack/smart-trust-tools.sh)/tools/hcert-kotlin" publishToMavenLocal --stacktrace

      - name: Check
        run: ./gradlew check -Pkotlin.daemon.jvmargs="-Xmx6g -XX:+UseG1GC" --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore
