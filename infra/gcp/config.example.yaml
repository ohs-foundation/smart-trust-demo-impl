# Copy to config.yaml (git-ignored) and fill in your own values.
project_id: my-trust-demo
project_name: SMART Trust demo
# One of org_id or folder_id, or neither for a project without an organisation.
org_id: "000000000000"
billing_account: 000000-000000-000000
region: europe-west3
zone: europe-west3-a
# 4 vCPU and 32 GB: the stack (JVMs, Medplum, three Postgres, the data pipes) needs memory more than CPU.
machine_type: e2-highmem-4
disk_gb: 100
# The demo's names are <service>.<country>.<base_domain>, e.g. keycloak.onesa.demo.example.org
base_domain: demo.example.org
repository: trust-demo
server_name: trust-demo
# owner/repo allowed to push images from CI (Workload Identity Federation); leave out for no CI access.
github_repository: my-org/my-trust-demo
